name: build

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: abyss

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: make -f Makefile.host

  calculator-build:
    # UNVERIFIED: not yet seen passing. Install step fixed to use the tar.gz asset.
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install CEdev
        run: |
          curl -fL -o "$HOME/cedev.tar.gz" \
            https://github.com/CE-Programming/toolchain/releases/latest/download/CEdev-Linux.tar.gz
          tar -xzf "$HOME/cedev.tar.gz" -C "$HOME"
          ls "$HOME/CEdev" "$HOME/CEdev/bin"
          echo "CEDEV=$HOME/CEdev" >> "$GITHUB_ENV"
          echo "$HOME/CEdev/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: cedev-config --makefile

      - name: Build
        run: make

      - name: Check output
        run: |
          test -s bin/ABYSS.8xp
          ls -l bin/ABYSS.8xp

      - uses: actions/upload-artifact@v4
        with:
          name: ABYSS-8xp
          path: abyss/bin/ABYSS.8xp
          if-no-files-found: error
